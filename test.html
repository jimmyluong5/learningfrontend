<!DOCTYPE html>
<html>
    <head>
        <button> <!-- you can make a button on html, we can also include hyperlinks-->
            click me  
        </button>

        <!-- we can use these buttons for portfolio, about me, linkedin, github and stuff like that-->

        <!-- to include hyperlinks we use <a> which is an attribute that modifies
            the behaviour of an element then href, which means
            hypertext reference. it basically tells the computer where to find the webpage
            -->

            <!-- basically i can do this and just hide my links behind buttons and it will open a new page-->
            <a href="https://google.com" target = "_blank"> <!-- you can also include _blank which makes google open up
                in a new tab-->
                click me
            </a>
            <!-- but eventually i will need to learn how to link pages directly-->
             
    </head>

</html>
